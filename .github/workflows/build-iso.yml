name: Build SilverPanda ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to install from (normally latest)
        required: true
        default: latest
        type: string

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/wiertless/silverpanda
  # Maintained successor to the archived JasonN3/build-container-installer.
  # Use upstream's own build (Fedora-based, from current source) rather than
  # quay.io/centos-bootc/bootc-image-builder, which packages the CentOS Stream
  # RPM and lags behind on new Fedora releases. Bump the tag deliberately.
  BIB_IMAGE: ghcr.io/osbuild/bootc-image-builder:v90.0.0@sha256:2d29e039bbc0a87506055368fa1ac1c1a511cefe762a95dd099e89e517701080

jobs:
  build-iso:
    name: Build installable SilverPanda ISO
    # Pinned: on the ubuntu-26.04 image (ubuntu-latest since Nov 2026)
    # osbuild's sandbox inside the privileged builder container fails with
    # "mount: /run/osbuild/tree/dev: permission denied". 24.04 is the
    # environment bootc-image-builder is known to work in on GitHub runners.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # Done inline instead of with jlumbroso/free-disk-space: that action was
      # transferred to lumbroso-commons in Nov 2026 and GitHub intermittently
      # fails to resolve the old name, which aborts the run before any job
      # starts (startup_failure, no logs).
      - name: Free disk space for the ISO build
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Check out ISO config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and pull the image
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          image_ref="${IMAGE_REPO}:${IMAGE_TAG}"

          # bootc-image-builder only reads images from local container storage.
          # (podman 4.x on ubuntu-24.04 has no --retry flag.)
          for attempt in 1 2 3; do
            sudo podman pull "$image_ref" && break
            if (( attempt == 3 )); then
              echo "Failed to pull $image_ref" >&2
              exit 1
            fi
            sleep $(( attempt * 15 ))
          done

          os_release=$(sudo podman run --rm --entrypoint cat "$image_ref" /usr/lib/os-release)
          os_id=$(sed -n 's/^ID=//p' <<< "$os_release" | tr -d '"')
          fedora_version=$(sed -n 's/^VERSION_ID=//p' <<< "$os_release" | tr -d '"')
          if [[ "$os_id" != fedora ]]; then
            echo "os-release ID is '$os_id', not 'fedora'; bootc-image-builder cannot find Fedora's installer packages for it." >&2
            exit 1
          fi
          if [[ ! "$fedora_version" =~ ^[0-9]+$ ]]; then
            echo "Could not read a Fedora version from the image (got '$fedora_version')." >&2
            exit 1
          fi

          iso_name="silverpanda-${IMAGE_TAG}-fedora-${fedora_version}-x86_64.iso"
          {
            echo "image_ref=$image_ref"
            echo "image_tag=$IMAGE_TAG"
            echo "fedora_version=$fedora_version"
            echo "iso_name=$iso_name"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${iso_name} from ${image_ref}."

      - name: Build ISO
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          ISO_NAME: ${{ steps.image.outputs.iso_name }}
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$GITHUB_WORKSPACE/iso/config.toml:/config.toml:ro" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB_IMAGE" \
            --log-level info \
            --progress verbose \
            --type anaconda-iso \
            --rootfs btrfs \
            "$IMAGE_REF"

          sudo chown -R "$(id -u):$(id -g)" output
          mv output/bootiso/install.iso "output/${ISO_NAME}"
          (cd output && sha256sum "$ISO_NAME" > "${ISO_NAME}-CHECKSUM")
          ls -lh output

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silverpanda-iso-${{ steps.image.outputs.image_tag }}-fedora-${{ steps.image.outputs.fedora_version }}
          path: |
            output/${{ steps.image.outputs.iso_name }}
            output/${{ steps.image.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
