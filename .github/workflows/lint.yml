name: lint
on:
  push:
    branches: [main] # PR branches are checked by the pull_request trigger
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck on image scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files 'files/**/*.sh' files/system/usr/bin files/system/usr/libexec)
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found."
            exit 0
          fi
          mapfile -t scripts < <(printf '%s\n' "${scripts[@]}" | sort -u)
          shellcheck --severity=warning "${scripts[@]}"
