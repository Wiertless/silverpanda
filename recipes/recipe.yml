---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: silverpanda
# description will be included in the image's metadata
description: Personal Fedora Silverblue image with KVM, TPM-assisted LUKS unlock and AMD NPU support.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
# Pin the Fedora major version. Bump it deliberately once every third-party
# repo below publishes builds for the new release.
image-version: 45

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Keep the base ID (fedora): installer/ISO tooling looks up Fedora package
  # repos by os-release ID, and a custom ID breaks ISO builds.
  - type: os-release
    properties:
      NAME: silverpanda
      PRETTY_NAME: SilverPanda

  - type: dnf
    repos:
      # Remove these repo files after the build. Packages still update with
      # every image rebuild; this just keeps Terra et al. from leaking into
      # later `rpm-ostree install` layering on user machines.
      cleanup: true
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - imput/helium
    install:
      packages:
      #  - micro
      #  - starship
        - fish
        - qemu-kvm
        - virt-manager
        - libvirt
        - virt-install
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - libguestfs-tools
        - libvirt-client
        - dnsmasq
        - edk2-ovmf
        - cryptsetup
        - mokutil
        - tpm2-tss
        - tpm2-tools
        - util-linux
        - ptyxis
        - fastfetch
        - git-credential-libsecret
        - tailscale
        - zed
        - helium-bin
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - yelp
        - gnome-tour

  # AMD NPU userspace (FastFlowLM/XRT). Kernel driver comes from Fedora.
  - from-file: ai-npu.yml

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install:
        - org.gnome.Loupe
        - org.gnome.World.PikaBackup
        - com.github.neithern.g4music
        - io.gitlab.librewolf-community
      - scope: user # Also add Flathub user repo, but no user packages

  - type: files
    files:
      - source: system   # copies `files/system/*` (* means everything inside it) into your image's root folder `/`
        destination: /

  # Enable modern libvirt daemons via socket activation. Do not grant every
  # local user libvirt-group access; system-socket polkit remains the gate.
  - type: systemd
    system:
      enabled:
        - virtqemud.service
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtlogd.socket
        - virtlockd.socket
        - silverpanda-libvirt-network.service
        - silverpanda-firstboot-luks-tpm.service

  # files/system/etc/dracut.conf.d enables the TPM2 dracut module. Rebuild the
  # initramfs in the image so it can use TPM2 tokens before mounting root.
  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
