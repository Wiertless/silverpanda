# Check for (and stage) image updates every 6 hours while the laptop is awake,
# and 15 minutes after boot, instead of once a day at 04:00: an update staged
# during the day is applied by the night-time restart (silverpanda-nightly).
[Timer]
OnCalendar=
OnCalendar=*-*-* 00/6:00:00
OnBootSec=15min
RandomizedDelaySec=10m
Persistent=true
